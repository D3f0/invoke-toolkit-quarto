[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoke-toolkit-quarto"
version = "0.1.0"
description = "A set of invoke-toolkit tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Author Name", email = "author@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "invoke-toolkit",  # Requires invoke-toolkit, any version
]

[project.entry-points."invoke_toolkit.collection"]
"quarto" = "invoke_toolkit_quarto:collection"

[tool.hatch.build.targets.wheel]
packages = ["src/invoke_toolkit_quarto"]
